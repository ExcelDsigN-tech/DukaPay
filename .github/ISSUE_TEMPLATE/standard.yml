name: Standard Issue
description: Report a bug, propose a feature, or flag a problem
title: "[component] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Title format:** `[component] Short description`, e.g. `[contracts] Separate minimum repayment from dust threshold`. Use the same component you pick below.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of DukaPay does this relate to?
      options:
        - "[backend] API routes, services, middleware, database logic"
        - "[contracts] Soroban/Rust smart contracts, money policy"
        - "[frontend] Next.js/React UI, i18n, client-side flows"
        - "[sdk] TypeScript SDK package (sdk/)"
        - "[indexer] Event indexer tooling (indexer/, indexer services)"
        - "[scripts] Deploy, tooling, and load-test scripts (scripts/)"
        - "[docs] Documentation, wiki, API docs, Swagger/OpenAPI alignment"
        - "[ci] CI/CD workflows, badges, supply-chain checks"
        - "[infra] Docker, environment/config drift, deployment infrastructure"
        - "[security] Secrets, PII crypto, signing, compliance, sanctions screening"
        - "[tests] Test suites, parity tests, E2E coverage, load-test baselines"
        - "[ops] Operations tooling, monitoring, admin dashboards"
        - "[product] Cross-cutting product flows spanning multiple components"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing, and where. Name files and functions. For a bug, include steps to reproduce and what you expected instead.
      placeholder: |
        `contracts/loan_manager/src/lib.rs` uses one setting for both the minimum repayment and the dust threshold in `repay`...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and how badly.
      placeholder: A borrower owing up to 100 USDC could close the loan with a 1-stroop payment.
    validations:
      required: true

  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested Fix
      description: A concrete approach. Point at the code to change.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Enhancement
        - Security
        - Performance
        - Tests
        - Documentation
        - Refactor
        - Chore
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: One checkbox per acceptance criterion. Keep the CI line last.
      value: |
        - [ ]
        - [ ]
        - [ ]
        - [ ]
        - [ ] All required CI checks pass
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        📋 Before working on this issue, please read our [Contributing Guidelines](https://github.com/ExcelDsigN-tech/dukapay/blob/main/CONTRIBUTING.md). It covers branching, commits, PR standards, testing and style guides.
        All official decisions, reviews and coordination happen right here on GitHub.
